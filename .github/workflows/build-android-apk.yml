name: Build To The Next Target APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor
        run: npm install @capacitor/core@6.2.1 @capacitor/android@6.2.1 @capacitor/cli@6.2.1

      
      - name: Prepare web assets
        run: |
          mkdir -p www

          if [ -f index.html ]; then
            INDEX_FILE="index.html"
          else
            INDEX_FILE=$(find . -type f -name index.html \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -not -path './android/*' | head -n 1)
          fi

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          fi

          echo "Menggunakan file: $INDEX_FILE"
          cp "$INDEX_FILE" www/index.html


      - name: Add Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: To-The-Next-Target-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
